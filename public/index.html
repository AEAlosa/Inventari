<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventari del cau</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ample:760px;
  /* neutres */
  --fons:#f0f1f2;
  --carta:#ffffff;
  --tinta:#182027;
  --tinta-2:#5a6672;
  --tinta-3:#8e99a4;
  --linia:#dfe3e7;
  --linia-2:#eef0f2;
  --sorra:#e7e3d9;

  /* sales */
  --pioners:#6d4fc7;  --pioners-suau:#f0ebfc;  --pioners-mig:#c9bcf0;
  --raiers:#1c79c9;   --raiers-suau:#e8f2fc;   --raiers-mig:#aed2f0;
  --llops:#0e8f66;    --llops-suau:#e5f4ee;    --llops-mig:#a3dcc5;
  --follets:#db7126;  --follets-suau:#fdf1e6;  --follets-mig:#f2c79c;
  --neutre:#5a6b7a;   --neutre-suau:#eef1f4;   --neutre-mig:#c3cdd6;

  /* estats */
  --alerta:#c8412f;   --alerta-suau:#fdedeb;
  --avis:#b07d10;     --avis-suau:#fdf5e3;
  --ok:#0e8f66;       --ok-suau:#e5f4ee;

  --tema:var(--neutre); --tema-suau:var(--neutre-suau); --tema-mig:var(--neutre-mig);

  --r-s:9px; --r-m:14px; --r-l:20px;
  --ombra-1:0 1px 2px rgba(24,32,39,.06);
  --ombra-2:0 2px 4px rgba(24,32,39,.05),0 10px 26px rgba(24,32,39,.07);
  --ombra-3:0 8px 20px rgba(24,32,39,.12),0 28px 60px rgba(24,32,39,.16);
  --barra:66px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--fons);color:var(--tinta);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--barra) + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit}
svg{display:block}

/* ============ capçalera ============ */
.cap{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--linia-2);
}
.cap-int{max-width:var(--ample);margin:0 auto;padding:11px 16px;display:flex;align-items:center;
  gap:10px;min-height:56px}
.tornar{
  display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
  background:var(--tema-suau);border:none;border-radius:99px;padding:7px 13px 7px 9px;
  color:var(--tema);font-weight:600;font-size:13.5px;cursor:pointer;max-width:46vw;
}
.tornar:active{transform:scale(.97)}
.tornar svg{width:16px;height:16px;flex:0 0 auto}
.tornar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tornar.nomes-icona{padding:9px;border-radius:99px}
.titol{flex:1;min-width:0}
.titol h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titol .sub{font-size:12px;color:var(--tinta-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titol .sub b{color:var(--ok);font-weight:600}
.titol .sub i{color:var(--alerta);font-style:normal;font-weight:600}
.punt-sala{width:10px;height:10px;border-radius:99px;background:var(--tema);flex:0 0 auto}
.ajuda-b{flex:0 0 auto;width:34px;height:34px;border-radius:99px;border:none;background:transparent;
  color:var(--tinta-3);cursor:pointer;display:grid;place-items:center}
.ajuda-b:hover{background:var(--tema-suau);color:var(--tema)}
.ajuda-b svg{width:21px;height:21px}
.mode-b.encesa{background:var(--tema);color:#fff}
.mode-b.encesa:hover{background:var(--tema);color:#fff}

/* ============ cos ============ */
.marc{max-width:var(--ample);margin:0 auto;padding:0 16px;display:flex;gap:24px;align-items:flex-start}
.cos{flex:1;min-width:0;padding:14px 0 26px}
.lateral{display:none}
@media (min-width:1040px){
  :root{--ample:1200px}
  .lateral{display:block;flex:0 0 332px;width:332px;padding-top:14px}
  .caixa-lat{position:sticky;top:76px;background:var(--carta);border:1px solid var(--linia);
    border-radius:var(--r-m);box-shadow:var(--ombra-1);overflow:hidden;
    display:flex;flex-direction:column;
    max-height:calc(100vh - 76px - var(--barra) - 22px)}
  .cap-lat{display:flex;align-items:center;gap:9px;padding:13px 16px 0}
  .cap-lat h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .cap-lat .bola{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--alerta);
    color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;
    font-variant-numeric:tabular-nums}
  .cos-lat{overflow:auto;padding:12px 16px 14px}
  .cos-lat .pest{margin-bottom:12px;flex-wrap:wrap;overflow:visible}
  .cos-lat .pest button{padding:5px 10px;font-size:12.5px}
  .cos-lat .rev{padding:9px 0}
  .cos-lat .rev .nom{font-size:14px}
  .tab.nomes-mobil{display:none}
  .tabs-int{grid-template-columns:repeat(3,1fr)}
}

.accions{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none}
.accions::-webkit-scrollbar{display:none}
.xip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  background:var(--carta);border:1px solid var(--linia);border-radius:99px;
  padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--tinta-2);cursor:pointer;
}
.xip:hover{border-color:var(--tinta-3);color:var(--tinta)}
.xip svg{width:15px;height:15px}
.xip.tema{background:var(--tema-suau);border-color:transparent;color:var(--tema)}

/* ============ llenç ============ */
.llenç{background:var(--carta);border-radius:var(--r-l);box-shadow:var(--ombra-2);
  overflow:hidden;margin-bottom:16px}
.llenç svg{width:100%;height:auto}
svg.planol{max-height:min(58vh,500px);touch-action:manipulation}
svg.moble{touch-action:manipulation}

.sala-forma{stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:opacity .15s}
g.toc{cursor:pointer}
g.toc:active .sala-forma{opacity:.82}
g.toc:focus{outline:none}
g.toc:focus-visible rect:first-of-type{stroke-dasharray:6 4}
.passadis{fill:var(--sorra);stroke:#cbc5b6;stroke-width:2.5;stroke-linejoin:round}
.et-sala{font-size:14.5px;font-weight:700;text-anchor:middle;pointer-events:none;
  letter-spacing:-.01em;paint-order:stroke;stroke-width:5;stroke-linejoin:round}
.et-comp{font-size:9.5px;font-weight:600;text-anchor:middle;pointer-events:none;opacity:.8;
  paint-order:stroke;stroke-width:4;stroke-linejoin:round}
.et-moble{font-size:9px;font-weight:700;text-anchor:middle;pointer-events:none;fill:#fff;
  paint-order:stroke;stroke-width:4;stroke-linejoin:round}
.prestatge{stroke:#fff;stroke-opacity:.34;stroke-width:1.3;pointer-events:none}
.fantasma{pointer-events:none}
.obertura{stroke:var(--fons);stroke-width:7;pointer-events:none}
.fulla{stroke:#a9a294;stroke-width:3.5;stroke-linecap:round;pointer-events:none}
.gir{fill:none;stroke:#a9a294;stroke-opacity:.5;stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
.et-porta{font-size:10.5px;font-weight:600;fill:var(--tinta-3);text-anchor:middle;pointer-events:none}

/* moble obert */
.carcassa{stroke-linejoin:round}
.cel{transition:fill .12s}
g.toc:hover .cel{fill:#f7f9fa}
.cel-tria{fill:none;stroke-width:3}
.et-cel{pointer-events:none;fill:var(--tinta)}
.et-cel.suau{fill:var(--tinta-3)}
.ref-cel{pointer-events:none;fill:var(--tinta-3);font-weight:600;font-variant-numeric:tabular-nums}
.bombolla{pointer-events:none}
.bombolla-txt{pointer-events:none;fill:#fff;font-weight:700;text-anchor:middle}

/* ============ llistes ============ */
.card{background:var(--carta);border-radius:var(--r-m);box-shadow:var(--ombra-1);
  overflow:hidden;margin-bottom:14px}
.card-cap{padding:12px 16px;border-bottom:1px solid var(--linia-2);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.card-cap h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card-cap .n{font-size:12.5px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.obj{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--linia-2)}
.obj:last-child{border-bottom:none}
.obj .t{flex:1;min-width:0}
.obj .nom{font-weight:600;line-height:1.3}
.obj .meta{font-size:12.5px;color:var(--tinta-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj .qt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--tinta-2);
  font-size:13.5px;white-space:nowrap;flex:0 0 auto}
.foto-m{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--linia-2);
  flex:0 0 auto;cursor:pointer}
.res-buit{padding:30px 18px;text-align:center;color:var(--tinta-3);font-size:14px}
.res-buit b{display:block;color:var(--tinta-2);font-weight:600;margin-bottom:3px}

.etq{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.e{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;line-height:1.55;white-space:nowrap}
.e.tasca{color:var(--avis);background:var(--avis-suau)}
.e.venc{color:var(--alerta);background:var(--alerta-suau)}
.e.fora{color:var(--raiers);background:var(--raiers-suau)}
.e.falta{color:var(--alerta);background:var(--alerta-suau)}
.e.tag{color:var(--tinta-2);background:var(--linia-2)}

.mes{flex:0 0 auto;width:32px;height:32px;border-radius:99px;border:none;background:transparent;
  color:var(--tinta-3);cursor:pointer;display:grid;place-items:center}
.mes:hover{background:var(--linia-2);color:var(--tinta)}
.mes svg{width:18px;height:18px}

/* ============ barra inferior ============ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.93);
  backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--linia-2);padding-bottom:env(safe-area-inset-bottom);
}
.tabs-int{max-width:var(--ample);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:none;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--tinta-3);cursor:pointer;position:relative;font-size:10px;
  font-weight:600;letter-spacing:.01em}
.tab svg{width:22px;height:22px}
.tab.actiu{color:var(--tema)}
.tab .bombolleta{position:absolute;top:5px;left:50%;margin-left:5px;min-width:17px;height:17px;
  padding:0 5px;border-radius:99px;background:var(--alerta);color:#fff;font-size:10.5px;
  font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

.fab{
  position:fixed;right:max(16px,calc(50vw - 380px + 16px));
  bottom:calc(var(--barra) + 16px + env(safe-area-inset-bottom));z-index:41;
  height:52px;padding:0 20px;border:none;border-radius:99px;background:var(--tema);color:#fff;
  font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 6px 18px rgba(24,32,39,.24);
  display:inline-flex;align-items:center;gap:8px;
}
.fab:active{transform:scale(.96)}
.fab svg{width:19px;height:19px}

/* ============ botons ============ */
.b{border:1px solid var(--tinta);background:var(--tinta);color:#fff;border-radius:var(--r-s);
  padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.b.clar{background:var(--carta);color:var(--tinta);border-color:var(--linia)}
.b.clar:hover{border-color:var(--tinta-3)}
.b.tema{background:var(--tema);border-color:var(--tema)}
.b.perill{background:var(--alerta);border-color:var(--alerta)}
.b.xicot{padding:5px 11px;font-size:12.5px;font-weight:600;border-radius:99px}
.b:disabled{opacity:.45;cursor:default}
.b:focus-visible{outline:2px solid var(--tema);outline-offset:2px}
.fila-b{display:flex;gap:8px;flex-wrap:wrap}
.fila-b.dreta{justify-content:flex-end}

/* ============ panells ============ */
dialog{border:none;padding:0;background:transparent;max-width:100%;max-height:100%;overflow:visible}
dialog::backdrop{background:rgba(24,32,39,.45);backdrop-filter:blur(2px)}
.full{background:var(--carta);border-radius:var(--r-l);box-shadow:var(--ombra-3);
  width:min(94vw,520px);overflow:auto;padding:24px;
  /* el marge de baix i el de dalt són iguals perquè el diàleg va centrat:
     així mai no arriba a tocar la barra de navegació inferior */
  max-height:calc(100vh - 2 * (var(--barra) + 14px))}
.full.ample{width:min(94vw,830px)}
.full.enorme{width:min(96vw,1000px)}
.full h2{margin:0 0 3px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.full .on{margin:0 0 18px;font-size:13px;color:var(--tinta-2)}
.full .ajuda{font-size:12.5px;color:var(--tinta-3);margin:8px 0 14px}
dialog.baix{margin:auto auto 0;width:100%;max-width:100%}
dialog.baix{margin-bottom:calc(var(--barra) + env(safe-area-inset-bottom))}
dialog.baix .full{width:100%;border-radius:var(--r-l) var(--r-l) 0 0;padding-bottom:20px;
  max-height:calc(100vh - var(--barra) - 40px)}
@media (min-width:560px){
  dialog.baix{margin:auto;margin-bottom:auto}
  dialog.baix .full{width:min(94vw,460px);border-radius:var(--r-l);padding-bottom:24px;
    max-height:calc(100vh - 2 * (var(--barra) + 14px))}
}
.nansa{width:38px;height:4px;border-radius:99px;background:var(--linia);margin:-6px auto 14px}
.opcio{display:flex;align-items:center;gap:13px;width:100%;padding:13px 6px;background:none;
  border:none;border-bottom:1px solid var(--linia-2);cursor:pointer;text-align:left;font-size:15px;
  font-weight:600;color:var(--tinta)}
.opcio:last-of-type{border-bottom:none}
.opcio:hover{background:var(--linia-2)}
.opcio svg{width:20px;height:20px;color:var(--tinta-3);flex:0 0 auto}
.opcio.perill{color:var(--alerta)}
.opcio.perill svg{color:var(--alerta)}
.opcio small{display:block;font-weight:400;font-size:12.5px;color:var(--tinta-3);margin-top:1px}

.camp{margin-bottom:14px}
.camp label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.camp input,.camp textarea,.camp select{width:100%;padding:11px 13px;border:1px solid var(--linia);
  border-radius:var(--r-s);font:inherit;font-size:16px;background:var(--carta);color:var(--tinta)}
.camp input:focus,.camp textarea:focus,.camp select:focus{outline:none;border-color:var(--tema);
  box-shadow:0 0 0 3px var(--tema-suau)}
.camp textarea{resize:vertical;min-height:66px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foto-camp{display:flex;gap:12px;align-items:center}
.foto-camp img{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.tot-ample{flex:1;min-width:0}
.tsk{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.tsk input[type=text]{flex:1;min-width:0}
.tsk input[type=date]{width:auto;flex:0 0 auto;font-size:14px;padding:9px 10px}
.tsk input[type=number]{width:66px;flex:0 0 auto;padding:9px 10px}
.tsk .x{flex:0 0 auto;width:30px;height:30px;border-radius:99px;border:1px solid var(--linia);
  background:var(--carta);color:var(--tinta-3);cursor:pointer;display:grid;place-items:center}
.tsk .x:hover{border-color:var(--alerta);color:var(--alerta)}

/* arbre d'espais */
.barra-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--carta);
  border:1px solid var(--linia);border-radius:var(--r-m);padding:10px 14px;margin-bottom:12px;
  box-shadow:var(--ombra-1);position:sticky;top:60px;z-index:12}
.barra-sel .compt{flex:1;min-width:140px;font-size:13.5px;font-weight:600;color:var(--tinta-2)}
.arbre{background:var(--carta);border:1px solid var(--linia);border-radius:var(--r-m);
  box-shadow:var(--ombra-1);overflow:hidden;margin-bottom:16px}
.fil{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--linia-2);
  padding-left:calc(13px + var(--niv) * 17px)}
.fil:last-child{border-bottom:none}
.fil:not(.obj-f):not(.buida){background:#fbfcfc;box-shadow:inset 3px 0 0 var(--cc,var(--linia))}
.fil.buida{color:var(--tinta-3);font-size:13px;padding-top:7px;padding-bottom:7px;
  border-bottom:1px solid var(--linia-2)}
.fil .tx{flex:1;min-width:0;cursor:default}
.fil:not(.obj-f) .tx{cursor:pointer}
.fil .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.fil:not(.obj-f) .nm{font-weight:700}
.fil .sb{font-size:12px;color:var(--tinta-3);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fil .qt{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--tinta-2);
  flex:0 0 auto}
.tic{flex:0 0 auto;width:21px;height:21px;border-radius:6px;border:1.8px solid var(--linia);
  background:var(--carta);cursor:pointer;position:relative;padding:0}
.tic:hover{border-color:var(--tema)}
.tic.si{background:var(--tema);border-color:var(--tema)}
.tic.si::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(42deg)}
.tic.part{background:var(--tema);border-color:var(--tema)}
.tic.part::after{content:'';position:absolute;left:4px;top:8px;width:9px;height:2.4px;background:#fff;
  border-radius:2px}
.fletxa{flex:0 0 auto;width:24px;height:24px;border:none;background:none;color:var(--tinta-3);
  cursor:pointer;display:grid;place-items:center;padding:0}
.fletxa svg{width:17px;height:17px;transition:transform .15s}
.fletxa.obert svg{transform:rotate(90deg)}
.fletxa:hover{color:var(--tinta)}
.cap-fletxa{flex:0 0 auto;width:24px}
.ves{flex:0 0 auto;width:28px;height:28px;border:none;background:none;color:var(--tinta-3);
  cursor:pointer;display:grid;place-items:center;border-radius:99px;padding:0}
.ves svg{width:17px;height:17px}
.ves:hover{background:var(--linia-2);color:var(--tema)}

/* cerca */
.cercador{position:relative;z-index:25;margin-bottom:14px}
.camp-cerca{display:flex;align-items:center;gap:10px;background:var(--carta);
  border:1px solid var(--linia);border-radius:99px;padding:0 15px;box-shadow:var(--ombra-1)}
.camp-cerca:focus-within{border-color:var(--tema);box-shadow:0 0 0 3px var(--tema-suau)}
.camp-cerca svg{width:18px;height:18px;flex:0 0 auto;color:var(--tinta-3)}
.camp-cerca input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:16px;
  color:var(--tinta);padding:13px 0}
.camp-cerca input:focus{outline:none}
.camp-cerca input::placeholder{color:#9aa5a1}
.camp-cerca input::-webkit-search-cancel-button{display:none}
.neteja{flex:0 0 auto;width:24px;height:24px;border-radius:99px;border:none;background:var(--linia-2);
  color:var(--tinta-2);font-size:15px;line-height:1;cursor:pointer}
.neteja:hover{background:var(--linia);color:var(--tinta)}
.suggeriments{display:none;position:absolute;top:calc(100% + 7px);left:0;right:0;z-index:30;
  background:var(--carta);border:1px solid var(--linia);border-radius:var(--r-m);
  box-shadow:var(--ombra-3);max-height:min(62vh,430px);overflow:auto;padding:5px}
.suggeriments.obert{display:block}
.sug{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:10px;cursor:pointer}
.sug:hover,.sug.actiu{background:var(--linia-2)}

function diesFins(d){
  if(!d) return null;
  return Math.round((new Date(d+'T00:00:00') - new Date(avui()+'T00:00:00'))/86400000);
}
function quanTxt(d){
  const n=diesFins(d);

function totesLesTasques(){
  const r=[];
  DADES.filter(f=>f.tipus==='objecte').forEach(o=>tasquesDe(o).forEach(t=>r.push({o:o,t:t})));
  return r.sort((a,b)=>String(a.t.quan||'9999').localeCompare(String(b.t.quan||'9999')));
}
const prestats = () => DADES.filter(f=>f.tipus==='objecte'&&f.prestec&&f.prestec.qui);
const perComprovar = () => DADES.filter(f=>f.tipus==='objecte').filter(o=>{
  const m=mesosDes(o.comprovat); return o.falta || m===null || m>=12;
}).sort((a,b)=>String(a.comprovat||'').localeCompare(String(b.comprovat||'')));
const quePendents = () => totesLesTasques().filter(x=>vençuda(x.t)).length +
  DADES.filter(f=>f.tipus==='objecte'&&f.falta).length +
  prestats().filter(o=>o.prestec.torna && diesFins(o.prestec.torna)<0).length;

/* ===================== arrencada ===================== */
async function arrencar(){
  try{
    const r = await fetch('/api/dades');
    if(r.status===401) return porta();
    const d = await r.json();
    PAPER=d.paper; VIST=d.actualitzat; DADES=d.files; LLISTES=d.llistes||[];
    esquelet(); indexar();
    const i = pilaDeCodi(location.hash);
    history.replaceState({p:i.pila.map(x=>x.id),c:i.caixa,m:false,k:null},'',
      location.hash||location.pathname);
    situar(i.pila, i.caixa, false);
  }catch(e){
    $('#tot').innerHTML='<div class="cos"><div class="avis-barra"><span class="creix">'+
      'No s\'ha pogut connectar. Comprova que tens internet i torna-ho a provar.</span>'+
      '<button class="b xicot clar" onclick="location.reload()">Reintenta</button></div></div>';
  }
}

function porta(mal){
  $('#tot').innerHTML =
    '<div class="entrada"><div class="card"><h1>Inventari del cau</h1>'+
    '<p>Escriu la contrasenya del grup per entrar.</p>'+
    '<input id="clau" type="password" autocomplete="current-password" placeholder="Contrasenya" autofocus>'+
    '<button class="b" id="va">Entra</button>'+
    (mal?'<p class="mal">'+esc(mal)+'</p>':'')+'</div></div>';
  const prova = async () => {
    const clau=$('#clau').value; if(!clau) return;
    $('#va').disabled=true; $('#va').textContent='Comprovant…';
    const r = await fetch('/api/entrar',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({clau:clau})});
    if(r.ok) arrencar();
    else porta(r.status===401?'Aquesta contrasenya no és correcta.':'Hi ha hagut un problema. Torna-ho a provar.');
  };
  $('#va').onclick=prova;
  $('#clau').onkeydown=e=>{ if(e.key==='Enter') prova(); };
}

function esquelet(){
  $('#tot').innerHTML =
    '<header class="cap"><div class="cap-int" id="cap"></div></header>'+
    '<div class="marc"><main class="cos"><div id="banda"></div>'+
      '<div class="cercador" id="cercador">'+
        '<div class="camp-cerca">'+ic('cerca')+
          '<input id="q" type="search" autocomplete="off" spellcheck="false" '+
          'placeholder="Busca un objecte i et dirà on és" aria-label="Busca a l\'inventari" '+
          'role="combobox" aria-expanded="false" aria-controls="sug">'+
          '<button class="neteja" id="q-x" aria-label="Esborra" hidden>×</button>'+
        '</div>'+
        '<div class="suggeriments" id="sug" role="listbox"></div>'+
      '</div>'+
      '<div id="accions"></div><div id="vista"></div></main>'+
      '<aside class="lateral" id="lateral" aria-label="Pendents"></aside></div>'+
    '<nav class="tabs"><div class="tabs-int" id="tabs"></div></nav>'+

  cablejarCerca();

/* La barra de cerca es queda sempre a la pàgina, o sigui que els seus
   escoltadors es lliguen un sol cop, quan es construeix l'esquelet. */
function cablejarCerca(){
  const q=$('#q'), x=$('#q-x'); if(!q) return;
  let temps;
  q.addEventListener('input', e=>{
    const v=e.target.value;
    if(x) x.hidden = !v;
    clearTimeout(temps);
    temps=setTimeout(()=>cercar(v.trim()), 110);
  });
  q.addEventListener('keydown', teclaCerca);
  q.addEventListener('focus', ()=>{ if(q.value.trim().length>=2) cercar(q.value.trim()); });
  /* El retard deixa que un clic damunt d'un suggeriment hi arribi abans que
     el desplegable es tanqui. */
  q.addEventListener('blur', ()=>setTimeout(tancaSug,150));
  if(x) x.onclick=()=>{ q.value=''; x.hidden=true; tancaSug(); q.focus(); };
  document.addEventListener('click', e=>{
    const c=$('#cercador');
    if(c && !c.contains(e.target)) tancaSug();
  });
}

/* ===================== navegació ===================== */
function codiDe(pila,caixa){
  if(!pila.length) return '';
  return '#'+pila.map(p=>p.id).join('/')+(caixa?'!'+caixa:'');
}
function pilaDeCodi(codi){
  const net=String(codi||'').replace(/^#/,'');
  if(!net) return {pila:[],caixa:null};
  const parts=net.split('!'), ruta=parts[0], caixa=parts[1];
  const pila=[]; let pare=null;
  for(const tros of ruta.split('/')){
    const f=PER_ID[decodeURIComponent(tros)];
    if(!f) return {pila:[],caixa:null};
    if((f.pare||null)!==pare) return {pila:[],caixa:null};
    pila.push({id:f.id}); pare=f.id;
  }
  return {pila:pila, caixa:caixa||null};
}
function estatAra(){
  return {p:cami.map(x=>x.id), c:caixaTriada, m:modeLlista, k:capa};
}

function tancaCapaReal(){
  const d=$('#dlg');
  if(d){ if(d.open) d.close(); d.className=''; }
  const m=document.getElementById('manual');
  if(m){ m.remove(); document.body.style.overflow=''; }
}

function situar(pila,caixa,apunta){
  const eraFons=!cami.length;
  /* Si se surt d'una capa navegant, la seva entrada d'historial queda a sota:
     tornar enrere et deixa on eres abans d'obrir-la, que és el que s'espera. */
  if(apunta && capa){ tancaCapaReal(); capa=null; }
  cami=pila; caixaTriada=caixa||null;
  if(apunta){
    history.pushState({p:pila.map(x=>x.id),c:caixaTriada,m:modeLlista,k:null},'',
      codiDe(pila,caixaTriada)||location.pathname);
    profunditat++;
  }
  if(!pila.length && !eraFons) vista=GENERAL.slice();
  aplicarTema(); pintar();
}
function aplicarTema(){
  const t = cami.length ? temaDe(cami[cami.length-1].id) : TEMES._;
  const a = document.documentElement.style;
  a.setProperty('--tema',t.c); a.setProperty('--tema-suau',t.s); a.setProperty('--tema-mig',t.m);
}
function arrel(){ situar([],null,true); }
function anarAlMapa(){
  if(modeLlista){ modeLlista=false; }
  situar([],null,true);
}
function entrar(id,pos){ situar(cami.concat([{id:id}]),pos||null,true); amunt(); }
function tornarA(n){ situar(cami.slice(0,n),null,true); }
function triar(pos){ situar(cami, caixaTriada===pos?null:pos, true); }
function amunt(){ if(window.scrollY>120) window.scrollTo({top:0,behavior:'smooth'}); }
function enrere(){
  if(capa) return tanca();
  if(profunditat>0){ history.back(); return; }
  if(caixaTriada) return situar(cami,null,true);
  if(cami.length) return situar(cami.slice(0,-1),null,true);
  if(modeLlista) return capgiraMode();
}
function anarAObjecte(id){
  const f=PER_ID[id]; if(!f) return;
  tancaSug();
  const pila=[]; let x=f.pare?PER_ID[f.pare]:null;
  while(x){ pila.unshift({id:x.id}); x=x.pare?PER_ID[x.pare]:null; }
  situar(pila, f.pos||null, true);
  window.scrollTo({top:0,behavior:'smooth'});
}
addEventListener('popstate', ev=>{
  if(saltaPop>0){ saltaPop--; return; }
  /* Si hi havia una capa oberta, aquesta entrada era seva: es tanca i prou. */
  if(capa){ tancaCapaReal(); capa=null; pintar(); return; }
  profunditat=Math.max(0,profunditat-1);
  const st = (ev.state && Array.isArray(ev.state.p)) ? ev.state : null;
  if(st){
    modeLlista=!!st.m;
    situar(st.p.map(id=>({id:id})).filter(x=>PER_ID[x.id]), st.c||null, false);
  } else {
    const r=pilaDeCodi(location.hash); situar(r.pila,r.caixa,false);
  }
});

/* ===================== pintat ===================== */
function actual(){ return cami.length?PER_ID[cami[cami.length-1].id]:null; }

function pintar(){
  pintarCap(); pintarAccions(); pintarTabs(); pintarFab(); pintarLateral();
  const a=actual();
  if(modeLlista) return vistaEspais();
  if(!a) vistaPlanol();
  else if(a.tipus==='sala') vistaSala(a);
  else vistaMoble(a);
}

function capgiraMode(){
  modeLlista=!modeLlista;
  history.pushState(estatAra(),'',location.hash||location.pathname);
  profunditat++;
  amunt(); pintar();
}

function pintarCap(){
  const a=actual();
  let h='';
  if(cami.length){
    const pare = cami.length>1 ? PER_ID[cami[cami.length-2].id] : null;
    if(caixaTriada){
      h += '<button class="tornar nomes-icona" onclick="enrere()" aria-label="Deixa la casella">'+
        ic('enrere')+'</button>';
    } else {
      const cap = pare?pare.nom:'Plànol';
      h += '<button class="tornar" onclick="enrere()" aria-label="Torna a '+esc(cap)+'">'+
        ic('enrere')+'<span>'+esc(cap)+'</span></button>';
    }
  }
  let titol='Inventari del cau', sub='';
  if(a){ titol = a.nom; sub = caixaTriada ? etqPos(caixaTriada) : compteTxt(compta(a.id)); }
  else {
    const n=DADES.filter(f=>f.tipus==='objecte').length;
    sub = compteTxt(n);
    if(VIST){ const d=new Date(VIST); if(!isNaN(d)) sub += ' · al dia '+d.toLocaleDateString('ca-ES',{day:'numeric',month:'short'}); }
  }
  if(estat==='desant') sub='<b>Desant…</b>';
  else if(estat==='desat') sub='<b>Desat</b>';
  else if(estat==='fallat') sub='<i>No s\'ha desat</i>';

  h += '<div class="titol"><h1>'+esc(titol)+'</h1><div class="sub">'+sub+'</div></div>';
  h += '<button class="ajuda-b mode-b'+(modeLlista?' encesa':'')+'" onclick="capgiraMode()" '+
    'aria-pressed="'+(modeLlista?'true':'false')+'" aria-label="'+
    (modeLlista?'Torna al mapa':'Mostra-ho com a llista')+'" title="'+
    (modeLlista?'Torna al mapa':'Mostra-ho com a llista')+'">'+
    ic(modeLlista?'mapa':'llistat')+'</button>';
  h += '<button class="ajuda-b" onclick="instruccions()" aria-label="Com funciona">'+ic('ajuda')+'</button>';
  if(a && salaDe(a.id)) h += '<span class="punt-sala"></span>';
  $('#cap').innerHTML=h;
}

function pintarAccions(){
  const a=actual(); let h='';
  if(a && !modeLlista){
    const xips=[];
    if(a.tipus==='sala'){
      if(EDITA()&&compta(a.id)) xips.push(['check','Revisa','revisar(\''+a.id+'\')',true]);
      if(EDITA()) xips.push(['graella','Gestionar mobles','gestionar(\''+a.id+'\')',false]);
    } else {
      if(EDITA()&&compta(a.id)) xips.push(['check','Revisa','revisar(\''+a.id+'\')',true]);
      if(EDITA()&&(caixaTriada||!a.files)) xips.push(['caixa','Nova caixa','formMoble()',false]);
      if(EDITA()) xips.push(['graella','Gestionar aquest moble','gestionarMoble(\''+a.id+'\')',false]);
    }
    if(xips.length) h += '<div class="accions">'+xips.map(x=>
      '<button class="xip'+(x[3]?' tema':'')+'" onclick="'+x[2]+'">'+ic(x[0])+x[1]+'</button>').join('')+'</div>';
  }
  $('#accions').innerHTML=h;
}

function pintarTabs(){
  const a=actual(), n=quePendents();
  const t=(k,icona,txt,accio,badge,cls)=>'<button class="tab'+(k?' actiu':'')+
    (cls?' '+cls:'')+'" onclick="'+accio+'">'+
    ic(icona)+(badge?'<span class="bombolleta">'+badge+'</span>':'')+'<span>'+txt+'</span></button>';
  $('#tabs').innerHTML =
    t(!cami.length&&!modeLlista,'mapa','Mapa','anarAlMapa()') +
    t(false,'llistes','Llistes','llistes()') +
    t(false,'llista','Pendents','pendents()',n,'nomes-mobil') +
    t(false,'mes','Més','menuMes()');
}

function pintarFab(){
  const a=actual();
  const pot = !modeLlista && a && a.tipus==='moble' && EDITA() && (caixaTriada || !a.files);
  $('#fab').innerHTML = pot ?
    '<button class="fab" onclick="formObjecte()">'+ic('suma')+'Afegeix</button>' : '';
}

/* ---------- plànol ---------- */
function portaEntrada(){
  const x=ENTRADA.x, a=ENTRADA.y1, b=ENTRADA.y2, r=b-a;
  return '<line class="obertura" x1="'+x+'" y1="'+a+'" x2="'+x+'" y2="'+b+'"></line>'+
    '<path class="gir" d="M '+(x-r)+' '+a+' A '+r+' '+r+' 0 0 0 '+x+' '+b+'"></path>'+
    '<line class="fulla" x1="'+x+'" y1="'+a+'" x2="'+(x-r)+'" y2="'+a+'"></line>'+
    '<text x="'+(x-r/2)+'" y="'+(b+22)+'" class="et-porta">Entrada</text>';
}

/* El nom de la sala va damunt d'una pastilla del seu color: així queda al mateix
   lloc a totes les sales i mai no es barreja amb el contorn dels mobles. */
/* Un nom llarg en una sala petita («Armari menjar») es faria més ample que la
   sala i trepitjaria la del costat. L'escalat de sota s'hi acosta a ull; qui
   garanteix que hi cap és ajustaEtiquetes(), que mesura el text ja dibuixat. */
/* Amb el text ja al document es pot mesurar: si encara sobresurt, se li diu
   l'amplada exacta que ha d'ocupar i el navegador l'hi encabeix. */
function ajustaEtiquetes(){
  const v=$('#vista'); if(!v) return;
  [].slice.call(v.querySelectorAll('.et-sala[data-max]')).forEach(t=>{
    const max=Number(t.getAttribute('data-max'));
    let w=0; try{ w=t.getBBox().width; }catch(e){ return; }
    if(w>max){
      t.setAttribute('textLength', max.toFixed(0));
      t.setAttribute('lengthAdjust','spacingAndGlyphs');
    }
  });
}

function etiquetaSala(cx,cy,nom,sota,T,ampleSala){
  const marge=(ampleSala||999)-10;
  const fsNom=14.5, fsSota=9.5;
  const volNom=nom.length*fsNom*0.46+20;
  const k=volNom>marge ? Math.max(0.6, marge/volNom) : 1;
  const a=Math.min(Math.max(volNom*k, sota.length*fsSota*0.5+20), marge);
  return '<rect x="'+(cx-a/2)+'" y="'+(cy-17)+'" width="'+a+'" height="34" rx="9" fill="'+T.s+
    '" opacity=".94"></rect>'+
    '<text x="'+cx+'" y="'+(cy-1)+'" class="et-sala" data-max="'+marge.toFixed(0)+
      '" style="font-size:'+(fsNom*k).toFixed(1)+'px" fill="'+T.c+'" stroke="none">'+esc(nom)+'</text>'+
    '<text x="'+cx+'" y="'+(cy+12)+'" class="et-comp" fill="'+T.c+'" stroke="none">'+esc(sota)+'</text>';
}

function vistaPlanol(){
  let s = rect(PASSADIS,{cls:'passadis',r:4}) + portaEntrada();

  for(const id in SALES){
    const g=SALES[id], f=PER_ID[id]; if(!f) continue;
    const T=TEMES[id], n=compta(id);
    s += '<g class="toc" tabindex="0" role="button" aria-label="'+esc(f.nom)+', '+n+' objectes" '+
      'onclick="entrar(\''+id+'\')" onkeydown="tecla(event,\''+id+'\')">'+
      rect(g,{cls:'sala-forma',fill:T.s,stroke:T.c})+
      etiquetaSala(g.x+g.w/2, g.y+g.h/2, f.nom, compteTxt(n), T, g.w)+'</g>';
  }

  // mobles com a ombres dins de cada sala
  for(const id in MOBLES){
    const g=MOBLES[id], f=PER_ID[id]; if(!f) continue;
    if(g.sala===null){
      const T=TEMES._;
      s += '<g class="toc" tabindex="0" role="button" aria-label="'+esc(f.nom)+'" '+
        'onclick="entrar(\''+id+'\')" onkeydown="tecla(event,\''+id+'\')">'+
        rect(g,{cls:'sala-forma',r:7,fill:T.s,stroke:T.c})+
        '<text x="'+(g.x+g.w/2)+'" y="'+(g.y+g.h/2+4)+'" class="et-sala" fill="'+T.c+
          '" stroke="'+T.s+'">'+esc(f.nom)+'</text></g>';
    } else {
      s += '<rect class="fantasma" x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+
        '" rx="3" fill="none" stroke="'+TEMES[g.sala].m+'" stroke-width="2"></rect>';
    }
  }

  $('#vista').innerHTML = '<div class="llenç"><svg id="svg" class="planol" viewBox="'+GENERAL.join(' ')+
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Plànol del cau">'+
    '<title>Plànol del cau</title>'+s+'</svg></div>';
  ajustaEtiquetes();
  vista=GENERAL.slice();
}

/* ---------- sala ---------- */
function vistaSala(sala){
  const g=SALES[sala.id], T=TEMES[sala.id]||TEMES._;
  let s = rect(g,{cls:'sala-forma',fill:T.s,stroke:T.c,estil:'pointer-events:none'});

  Object.keys(MOBLES).filter(id=>MOBLES[id].sala===sala.id).forEach(id=>{
    const gm=MOBLES[id], f=PER_ID[id]; if(!f) return;
    const n=compta(id), vert=gm.h>gm.w*1.5, petit=Math.min(gm.w,gm.h)<22;
    s += '<g class="toc" tabindex="0" role="button" aria-label="'+esc(f.nom)+', '+n+' objectes" '+
      'onclick="entrar(\''+id+'\')" onkeydown="tecla(event,\''+id+'\')">'+
      rect(gm,{cls:'sala-forma',r:4,fill:T.c,stroke:T.c})+
      prestatges(gm,f);
    const hl=' stroke="'+T.c+'"';
    if(petit){
      s += '<text transform="translate('+(gm.x+gm.w/2)+','+(gm.y+gm.h/2)+') rotate(-90)" '+
        'class="et-moble" font-size="7.5"'+hl+'>'+esc(retalla(f.nom,12))+'</text>';
    } else if(vert){
      s += '<text transform="translate('+(gm.x+gm.w/2)+','+(gm.y+gm.h/2)+') rotate(-90)" '+
        'class="et-moble"'+hl+'>'+esc(f.nom)+'</text>';
    } else {
      s += '<text x="'+(gm.x+gm.w/2)+'" y="'+(gm.y+gm.h/2+(gm.h>34?0:3))+'" class="et-moble"'+hl+'>'+
        esc(retalla(f.nom,Math.floor(gm.w/4.6)))+'</text>';
      if(gm.h>34) s += '<text x="'+(gm.x+gm.w/2)+'" y="'+(gm.y+gm.h/2+12)+
        '" class="et-moble" font-size="8" opacity=".85"'+hl+'>'+(n||'buit')+'</text>';
    }
    s += '</g>';
  });

  const p=22;
  let h='<div class="llenç"><svg id="svg" class="planol" viewBox="'+
    [g.x-p,g.y-p,g.w+p*2,g.h+p*2].join(' ')+'" preserveAspectRatio="xMidYMid meet" role="img" '+
    'aria-label="'+esc(sala.nom)+'"><title>'+esc(sala.nom)+'</title>'+s+'</svg></div>';

  const solts = moblesA(sala.id).filter(m=>!MOBLES[m.id]);
  if(solts.length){
    h += '<div class="card"><div class="card-cap"><h2>Altres mobles</h2>'+
      '<span class="n">'+solts.length+'</span></div>'+
      solts.map(m=>caixaFila(m)).join('')+'</div>';
  }
  $('#vista').innerHTML=h;
}

function prestatges(g,f){
  if(!f.files||f.files<2||g.h<24) return '';
  const tram=Math.max(4,g.w*0.2);
  let s='';
  for(let i=1;i<f.files;i++){
    const y=g.y+(g.h/f.files)*i;
    s += '<line class="prestatge" x1="'+(g.x+3)+'" y1="'+y+'" x2="'+(g.x+3+tram)+'" y2="'+y+'"></line>'+
         '<line class="prestatge" x1="'+(g.x+g.w-3-tram)+'" y1="'+y+'" x2="'+(g.x+g.w-3)+'" y2="'+y+'"></line>';
  }
  return s;
}

/* ---------- moble obert ---------- */
function vistaMoble(m){
  if(!m.files||!m.columnes) return vistaLliure(m);
  const T=temaDe(m.id), g=MOBLES[m.id];

  /* Tot es calcula en píxels de pantalla i el viewBox s'hi ajusta, o sigui que
     la lletra es llegeix igual en un moble de dotze caselles que en un d'una.  */
  const W = Math.round(Math.min(window.innerWidth-34, 726));
  const altMax = Math.min(window.innerHeight*0.58, 540);
  const marc=9, pad=8, gap=8, lt=12.5, rf=9.5, lin=lt*1.38;

  const cw=(W-marc*2-pad*2-gap*(m.columnes-1))/m.columnes;

  /* Alçada: parteix de la forma real del moble, però una casella no s'estira
     més del que demana el que hi ha a dins.                                    */
  let asp = g ? (g.w/m.columnes)/(g.h/m.files) : 1.1;
  const maxCaps = Math.max(1, ...[0].concat(
    [].concat.apply([], Array.from({length:m.files},(_,r)=>
      Array.from({length:m.columnes},(_,c)=>{
        const q='R'+(r+1)+'C'+(c+1);
        return objsA(m.id,q).length + moblesA(m.id,q).length;
      })))));
  const contingut = rf + 12 + Math.min(maxCaps,4)*lin + 12;
  const sostre = Math.max(contingut + 26, 108);
  const ch = lim(cw/lim(asp,0.62,1.42), 62, sostre);
  const H = Math.round(marc*2+pad*2+m.files*ch+gap*(m.files-1));

  const linies = cw<98 ? 0 : Math.max(0, Math.floor((ch-rf-16)/lin));
  const lletres = Math.max(5, Math.floor((cw-22)/(lt*0.52)));

  let s = '<rect x="'+marc+'" y="'+marc+'" width="'+(W-marc*2)+'" height="'+(H-marc*2)+
    '" rx="14" class="carcassa" fill="'+T.s+'" stroke="'+T.c+'" stroke-width="2.5"></rect>';

  for(let r=1;r<=m.files;r++) for(let c=1;c<=m.columnes;c++){
    const pos='R'+r+'C'+c;
    const x=marc+pad+(c-1)*(cw+gap), y=marc+pad+(r-1)*(ch+gap);
    const objs=objsA(m.id,pos), subs=moblesA(m.id,pos);
    const ple=objs.length||subs.length, tria=caixaTriada===pos;
    const caps=[].concat(subs.map(v=>({t:v.nom,sub:true})), objs.map(v=>({t:v.nom,sub:false})));

    s += '<g class="toc" tabindex="0" role="button" aria-label="'+etqPos(pos)+', '+
      (ple?objs.length+' objectes':'buit')+'" onclick="triar(\''+pos+'\')" '+
      'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();triar(\''+pos+'\')}">'+
      '<rect class="cel" x="'+x+'" y="'+y+'" width="'+cw+'" height="'+ch+'" rx="9" '+
      'fill="#fff" stroke="'+(ple?T.m:'#e4e8eb')+'" stroke-width="'+(ple?1.6:1.2)+'"></rect>';

    if(tria) s += '<rect class="cel-tria" x="'+(x+2.5)+'" y="'+(y+2.5)+'" width="'+(cw-5)+
      '" height="'+(ch-5)+'" rx="7" stroke="'+T.c+'" stroke-width="2.4"></rect>';

    s += '<text x="'+(x+10)+'" y="'+(y+rf+7)+'" class="ref-cel" font-size="'+rf+'">'+r+'·'+c+'</text>';

    if(objs.length){
      s += '<circle class="bombolla" cx="'+(x+cw-17)+'" cy="'+(y+15)+'" r="9" fill="'+T.c+'"></circle>'+
        '<text class="bombolla-txt" x="'+(x+cw-17)+'" y="'+(y+18.5)+'" font-size="10.5">'+
        objs.length+'</text>';
    } else if(subs.length){
      s += '<circle class="bombolla" cx="'+(x+cw-17)+'" cy="'+(y+15)+'" r="6" fill="'+T.m+'"></circle>';
    }

    if(linies<=0){
      if(ple && !objs.length) s += '<circle cx="'+(x+cw/2)+'" cy="'+(y+ch/2+4)+
        '" r="6" fill="'+T.c+'" opacity=".7"></circle>';
    } else {
      let yy = y + rf + 13 + lt;
      caps.slice(0,linies).forEach(el=>{
        s += '<text x="'+(x+10)+'" y="'+yy+'" class="et-cel" font-size="'+lt+'"'+
          (el.sub?' font-weight="700" fill="'+T.c+'"':'')+'>'+esc(retalla(el.t,lletres))+'</text>';
        yy += lin;
      });
      if(caps.length>linies) s += '<text x="'+(x+10)+'" y="'+yy+'" class="et-cel suau" font-size="'+
        (lt*0.9)+'">+'+(caps.length-linies)+' més</text>';
      if(!ple) s += '<text x="'+(x+10)+'" y="'+(y+ch/2+5)+'" class="et-cel suau" font-size="'+
        lt+'">buit</text>';
    }
    s += '</g>';
  }

  let h='<div class="llenç"><svg class="moble" viewBox="0 0 '+W+' '+H+
    '" preserveAspectRatio="xMidYMid meet" style="max-height:'+Math.round(altMax)+'px" '+
    'role="img" aria-label="'+esc(m.nom)+'"><title>'+esc(m.nom)+'</title>'+s+'</svg></div>';

  if(caixaTriada){
    const objs=objsA(m.id,caixaTriada), subs=moblesA(m.id,caixaTriada);
    h += '<div class="card"><div class="card-cap"><h2>'+esc(etqPos(caixaTriada))+'</h2>'+
      '<span class="n">'+compteTxt(objs.length)+'</span></div>'+
      (objs.length?objs.map(o=>fila(o)).join('')
        :'<div class="res-buit"><b>Aquesta casella és buida</b>'+
          (EDITA()?'Fes servir el botó Afegeix.':'')+'</div>')+'</div>';
    if(subs.length) h += '<div class="card"><div class="card-cap"><h2>Caixes a dins</h2>'+
      '<span class="n">'+subs.length+'</span></div>'+subs.map(sb=>caixaFila(sb)).join('')+'</div>';
  } else {
    h += '<div class="res-buit" style="background:var(--carta);border-radius:var(--r-m);'+
      'box-shadow:var(--ombra-1)"><b>Tria una casella</b>Toca un compartiment per veure què hi ha.</div>';
  }
  $('#vista').innerHTML=h;
}

function caixaFila(sb){
  return '<div class="obj" onclick="entrar(\''+sb.id+'\')" style="cursor:pointer">'+
    '<div class="t"><div class="nom">'+esc(sb.nom)+'</div>'+
    '<div class="meta">'+(sb.files?sb.files+' × '+sb.columnes+' compartiments':'llista lliure')+
    '</div></div><span class="qt">'+compta(sb.id)+'</span></div>';
}

const retalla = (t,n) => String(t).length>n ? String(t).slice(0,Math.max(1,n-1))+'…' : String(t);

function vistaLliure(m){
  const subs=moblesA(m.id), objs=objsA(m.id);
  let h='';
  if(subs.length) h += '<div class="card"><div class="card-cap"><h2>Caixes</h2>'+
    '<span class="n">'+subs.length+'</span></div>'+subs.map(sb=>caixaFila(sb)).join('')+'</div>';
  h += '<div class="card"><div class="card-cap"><h2>'+esc(m.nom)+'</h2><span class="n">'+
    compteTxt(objs.length)+'</span></div>'+
    (objs.length?objs.map(o=>fila(o)).join('')
      :'<div class="res-buit"><b>Encara no hi ha res apuntat aquí</b>'+
        (EDITA()?'Fes servir el botó Afegeix.':'')+'</div>')+'</div>';
  $('#vista').innerHTML=h;

/* ---------- fila d'objecte ---------- */
function etiquetes(o){
  const m=etsDe(o).map(e=>'<span class="e tag">'+esc(e)+'</span>');
  if(o.falta) m.push('<span class="e falta">no s\'ha trobat</span>');
  if(o.prestec&&o.prestec.qui){
    const tard = o.prestec.torna && diesFins(o.prestec.torna)<0;
    m.push('<span class="e '+(tard?'venc':'fora')+'">'+esc(o.prestec.qui)+
      (o.prestec.torna?' · torna '+esc(quanTxt(o.prestec.torna)):'')+'</span>');
  }
  tasquesDe(o).forEach(t=>m.push('<span class="e '+(vençuda(t)?'venc':'tasca')+'">'+
    esc(t.text)+(t.quan?' · '+esc(quanTxt(t.quan)):'')+'</span>'));
  return m.length?'<div class="etq">'+m.join('')+'</div>':'';
}

function fila(o,ambOn){
  const et=etiquetes(o);
  return '<div class="obj">'+
    (o.foto?'<img class="foto-m" loading="lazy" src="/api/foto?id='+encodeURIComponent(o.id)+
      '" alt="" onclick="veureFoto(\''+o.id+'\')">':'')+
    '<div class="t"><div class="nom">'+esc(o.nom)+'</div>'+
    (o.notes?'<div class="meta">'+esc(o.notes)+'</div>':'')+
    (ambOn?'<div class="meta">'+esc(onEs(o))+'</div>':'')+et+'</div>'+
    (o.quantitat!=null?'<span class="qt">×'+o.quantitat+'</span>':'')+
    (EDITA()?'<button class="mes" onclick="menuObjecte(\''+o.id+'\')" aria-label="Opcions">'+
      ic('mes')+'</button>':'')+'</div>';
}

/* ===================== desar ===================== */
let coa=null;
async function desar(){
  estat='desant'; pintarCap();
  try{
    const r=await fetch('/api/dades',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({files:DADES,llistes:LLISTES,vist:VIST})});
    const d=await r.json();
    if(r.status===409){
      estat=''; pintarCap();
      $('#banda').innerHTML='<div class="avis-barra"><span class="creix">'+
        'Algú altre ha desat canvis mentre editaves. Recarrega per veure la versió bona; '+
        'el que has fet ara no s\'ha guardat.</span>'+
        '<button class="b xicot clar" onclick="location.reload()">Recarrega</button></div>';
      return;
    }
    if(!r.ok) throw new Error(d.error||'error');
    VIST=d.actualitzat; estat='desat'; pintarCap();
    clearTimeout(coa); coa=setTimeout(()=>{estat=''; pintarCap();},2000);
  }catch(e){
    estat='fallat'; pintarCap();
    $('#banda').innerHTML='<div class="avis-barra"><span class="creix">'+
      'No s\'han pogut desar els canvis. Comprova la connexió.</span>'+
      '<button class="b xicot clar" onclick="desar()">Reintenta</button></div>';
  }
}

/* ===================== mode llista ===================== */
/* El mateix contingut que el mapa, però com a arbre desplegable i amb caselles
   per triar què vols endur-te a l'Excel. Mostra el que hi ha sota on ets:
   des d'una sala, aquella sala; des del plànol, tot el cau.                   */

function fillsOrdenats(id){
  return fillsDe(id).slice().sort((a,b)=>{
    if((a.tipus==='objecte')!==(b.tipus==='objecte')) return a.tipus==='objecte'?1:-1;
    if(a.tipus==='objecte' && a.pos!==b.pos) return String(a.pos).localeCompare(String(b.pos),'ca',{numeric:true});
    return a.nom.localeCompare(b.nom,'ca');
  });
}

function estatCasella(n){
  if(n.tipus==='objecte') return seleccio.has(n.id)?'si':'no';
  const ids=totsSota(n.id).map(o=>o.id);
  if(!ids.length) return 'no';
  const k=ids.filter(i=>seleccio.has(i)).length;
  return k===0?'no':(k===ids.length?'si':'part');
}

function capgiraSel(id){
  const n=PER_ID[id]; if(!n) return;
  if(n.tipus==='objecte'){
    seleccio.has(id)?seleccio.delete(id):seleccio.add(id);
  } else {
    const ids=totsSota(id).map(o=>o.id);
    const tots=ids.length && ids.every(i=>seleccio.has(i));
    ids.forEach(i=> tots?seleccio.delete(i):seleccio.add(i));
  }
  repintaArbre();
}

function capgiraPlec(id){
  plegats[id]=!plegats[id];
  repintaArbre();
}

function repintaArbre(){
  const y=window.scrollY;
  vistaEspais();
  window.scrollTo({top:y});
}

function arrelsLlista(){
  const a=actual();
  return a ? [a] : fillsDe(null);
}

function nodeArbre(n,nivell){
  const esObj = n.tipus==='objecte';
  const fills = esObj?[]:fillsOrdenats(n.id);
  const obert = !plegats[n.id];
  const est = estatCasella(n);
  const T = temaDe(n.id);
  const n_ = esObj?0:compta(n.id);

  let sub='';
  if(esObj){
    const t=[];
    if(n.pos) t.push(etqPos(n.pos));
    if(etsDe(n).length) t.push(etsDe(n).join(', '));
    if(n.prestec&&n.prestec.qui) t.push('fora, amb '+n.prestec.qui);
    if(n.falta) t.push('no s\'ha trobat');
    sub=t.join(' · ');
  } else {
    sub = n.tipus==='sala' ? compteTxt(n_)
      : (n.files?n.files+' × '+n.columnes+' compartiments · ':'')+compteTxt(n_);
  }

  let h='<div class="fil'+(esObj?' obj-f':'')+'" style="--niv:'+nivell+
      (esObj?'':';--cc:'+T.c)+'">'+
    '<button class="tic '+est+'" onclick="capgiraSel(\''+n.id+'\')" role="checkbox" '+
      'aria-checked="'+(est==='si'?'true':est==='part'?'mixed':'false')+'" '+
      'aria-label="Tria '+esc(n.nom)+'"></button>'+
    (esObj||!fills.length
      ? '<span class="cap-fletxa"></span>'
      : '<button class="fletxa'+(obert?' obert':'')+'" onclick="capgiraPlec(\''+n.id+'\')" '+
        'aria-expanded="'+(obert?'true':'false')+'" aria-label="Desplega '+esc(n.nom)+'">'+
        '<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" '+
        'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>')+
    '<div class="tx" '+(esObj?'':'onclick="capgiraPlec(\''+n.id+'\')"')+'>'+
      '<div class="nm">'+esc(n.nom)+'</div>'+
      (sub?'<div class="sb">'+esc(sub)+'</div>':'')+'</div>'+
    (esObj && n.quantitat!=null?'<span class="qt">×'+n.quantitat+'</span>':'')+
    (esObj?'<button class="ves" onclick="anarAObjecte(\''+n.id+'\')" '+
      'aria-label="Ves-hi al mapa">'+ic('mapa')+'</button>':'')+
    '</div>';

  if(!esObj && obert && fills.length)
    h += fills.map(f=>nodeArbre(f,nivell+1)).join('');
  if(!esObj && obert && !fills.length)
    h += '<div class="fil buida" style="--niv:'+(nivell+1)+'">Encara no hi ha res aquí.</div>';
  return h;
}

function vistaEspais(){
  const arrels=arrelsLlista();
  const totsIds=[].concat.apply([],arrels.map(a=>totsSota(a.id).map(o=>o.id)));
  const triats=totsIds.filter(i=>seleccio.has(i)).length;

  let h='<div class="barra-sel">'+
    '<span class="compt">'+(triats?triats+' de '+totsIds.length+' triats':
      'Tria què vols descarregar')+'</span>'+
    '<div class="b-grup">'+
    '<button class="b xicot clar" onclick="selTot('+(triats===totsIds.length&&totsIds.length?'false':'true')+')">'+
      (triats===totsIds.length&&totsIds.length?'Cap':'Tot')+'</button>'+
    '<button class="b xicot" onclick="excelSeleccio()"'+(triats?'':' disabled')+'>'+
      'Descarrega en Excel</button></div></div>';

  h += '<div class="arbre">'+arrels.map(a=>nodeArbre(a,0)).join('')+'</div>';
  $('#vista').innerHTML=h;
}

function selTot(posa){
  const ids=[].concat.apply([],arrelsLlista().map(a=>totsSota(a.id).map(o=>o.id)));
  ids.forEach(i=> posa?seleccio.add(i):seleccio.delete(i));
  repintaArbre();
}

function excelSeleccio(){
  if(!comprovaXLSX()) return;
  const arrels=arrelsLlista();
  const ids=new Set([].concat.apply([],arrels.map(a=>totsSota(a.id).map(o=>o.id))));
  const objs=DADES.filter(f=>f.tipus==='objecte'&&ids.has(f.id)&&seleccio.has(f.id))
    .sort((a,b)=>grupDe(a,'lloc').localeCompare(grupDe(b,'lloc'),'ca')||a.nom.localeCompare(b.nom,'ca'));
  if(!objs.length) return;
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, fullTaula([CAPS].concat(objs.map(o=>filaExcel(o,null))),AMPLES),'Selecció');
  XLSX.utils.book_append_sheet(wb, fullResum(objs),'Resum');
  const on = arrels.length===1 ? arrels[0].nom : 'cau';
  const net=on.replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,40)||'cau';
  XLSX.writeFile(wb,'inventari — '+net+' — '+avui()+'.xlsx');
}

/* ===================== cerca ===================== */
/* Cercador de tota la vida: la pàgina es queda on és i sota la barra surt un
   desplegable amb el que encaixa. Suggereix objectes, mobles i sales.        */

let SUG=[], sugTriat=-1;

function cercar(q){
  const caixa=$('#sug'); if(!caixa) return;
  if(q.length<2){ tancaSug(); return; }
  const n=norm(q);

  const puntua=(f)=>{
    const nm=norm(f.nom);
    if(nm===n) return 0;
    if(nm.startsWith(n)) return 1;
    if(nm.includes(n)) return 2;
    if(f.tipus==='objecte'&&etsDe(f).some(e=>norm(e).startsWith(n))) return 3;
    if(f.tipus==='objecte'&&etsDe(f).some(e=>norm(e).includes(n))) return 4;
    if(f.tipus==='objecte'&&norm(f.notes).includes(n)) return 5;
    return 9;
  };

  SUG = DADES.map(f=>({f:f,p:puntua(f)}))
    .filter(x=>x.p<9)
    .sort((a,b)=>a.p-b.p || (a.f.tipus==='objecte'?0:1)-(b.f.tipus==='objecte'?0:1)
      || a.f.nom.localeCompare(b.f.nom,'ca'))
    .slice(0,12)
    .map(x=>x.f);

  sugTriat=-1;
  if(!SUG.length){
    caixa.innerHTML='<div class="sug-res">Cap element amb aquest nom.</div>';
    caixa.classList.add('obert'); $('#q').setAttribute('aria-expanded','true');
    return;
  }
  caixa.innerHTML = SUG.map((f,i)=>{
    const T=temaDe(f.id);
    const mena = f.tipus==='objecte' ? 'objecte' : (f.tipus==='sala'?'sala':'moble');
    const on = f.tipus==='objecte' ? onEs(f) : (f.tipus==='sala'?compteTxt(compta(f.id)):ubicacio(f));
    return '<div class="sug" role="option" data-i="'+i+'" onmousedown="triaSug('+i+')">'+
      (f.foto?'<img class="sug-ic" loading="lazy" src="/api/foto?id='+encodeURIComponent(f.id)+'" alt="">'
             :'<span class="sug-ic" style="background:'+T.s+';color:'+T.c+'">'+
               esc(f.tipus==='objecte'?inicialSala(f.id):(f.tipus==='sala'?'▢':'▤'))+'</span>')+
      '<div class="t"><div class="nm">'+esc(f.nom)+
        '<span class="mena">'+mena+'</span></div>'+
      '<div class="on">'+esc(on)+'</div></div>'+
      (f.tipus==='objecte'&&f.quantitat!=null?'<span class="qt">×'+f.quantitat+'</span>':'')+
      '</div>';
  }).join('');
  caixa.classList.add('obert');
  $('#q').setAttribute('aria-expanded','true');
}

function tancaSug(){
  const c=$('#sug'); if(!c) return;
  c.classList.remove('obert'); c.innerHTML=''; sugTriat=-1;
  const q=$('#q'); if(q) q.setAttribute('aria-expanded','false');
}

function teclaCerca(e){
  const c=$('#sug');
  if(e.key==='Escape'){ tancaSug(); e.target.blur(); return; }
  if(!c||!c.classList.contains('obert')||!SUG.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    sugTriat = e.key==='ArrowDown'
      ? Math.min(sugTriat+1, SUG.length-1)
      : Math.max(sugTriat-1, 0);
    [].slice.call(c.querySelectorAll('.sug')).forEach((d,i)=>
      d.classList.toggle('actiu', i===sugTriat));
    const act=c.querySelector('.sug.actiu'); if(act) act.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'){
    e.preventDefault();
    triaSug(sugTriat>=0?sugTriat:0);
  }
}

function triaSug(i){
  const f=SUG[i]; if(!f) return;
  const q=$('#q'); if(q){ q.value=''; q.blur(); }
  $('#q-x').hidden=true;
  tancaSug();
  if(f.tipus==='objecte') return anarAObjecte(f.id);
  // sala o moble: s'hi entra directament
  const pila=[]; let x=f;
  while(x){ pila.unshift({id:x.id}); x=x.pare?PER_ID[x.pare]:null; }
  situar(pila, null, true);
  window.scrollTo({top:0,behavior:'smooth'});
}

function veureFoto(id){
  const o=PER_ID[id];
  obrir('<h2>'+esc(o.nom)+'</h2><p class="on">'+esc(onEs(o))+'</p>'+
    '<img src="/api/foto?id='+encodeURIComponent(id)+'" alt="" '+
    'style="display:block;max-width:100%;max-height:64vh;margin:0 auto;border-radius:12px">'+
    '<div class="fila-b dreta" style="margin-top:18px"><button class="b clar" onclick="tanca()">Tanca</button></div>',
    'ample');
}
function encongir(fitxer){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(fitxer);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const max=900, e=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*e); c.height=Math.round(img.height*e);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('no s\'ha pogut processar')),'image/jpeg',0.72);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('no és una imatge')); };
    img.src=url;
  });
}
async function pujarFoto(id,blob){
  const r=await fetch('/api/foto?id='+encodeURIComponent(id),
    {method:'POST',headers:{'content-type':'image/jpeg'},body:blob});
  if(!r.ok) throw new Error('no s\'ha pogut pujar');
}

function afegirFilaTasca(t){

    '<input type="number" min="0" max="120" placeholder="mesos" value="'+(t.mesos||'')+'">'+
    '<button class="x" type="button" title="Treu la tasca">×</button>';
  c.querySelector('.x').onclick=()=>c.remove();
  c.dataset.id=t.id||'';
  $('#tasques').appendChild(c);
}
function llegirTasques(){
  return [].slice.call(document.querySelectorAll('#tasques .tsk')).map(c=>{
    const e=c.querySelectorAll('input');
    return {id:c.dataset.id||nouId('t'),text:e[0].value.trim(),quan:e[1].value||'',mesos:Number(e[2].value)||0};
  }).filter(t=>t.text);
}
function ferTasca(idObj,idTasca){
  const o=PER_ID[idObj]; if(!o) return;
  const t=tasquesDe(o).find(x=>x.id===idTasca); if(!t) return;
  if(t.mesos>0){
    const base=t.quan?new Date(t.quan+'T00:00:00'):new Date();
    base.setMonth(base.getMonth()+t.mesos);
    t.quan=base.toISOString().slice(0,10);
  } else o.tasques=tasquesDe(o).filter(x=>x.id!==idTasca);
  o.actualitzat=new Date().toISOString();
  desar(); pendents();
}

    '<button class="b perill" id="tok">Treu-ho</button></div>');

    const fora={}, fills={};
    DADES.forEach(x=>{ const p=x.pare||''; (fills[p]=fills[p]||[]).push(x.id); });
    (function baixa(x){ fora[x]=1; (fills[x]||[]).forEach(baixa); })(id);

      fetch('/api/foto?id='+encodeURIComponent(x.id),{method:'DELETE'}).catch(()=>{});

function revisar(id){ revArrel=id; pintarRevisio(); }
function pintarRevisio(){
  const a=PER_ID[revArrel];
  const objs=totsSota(revArrel).sort((x,y)=>onEs(x).localeCompare(onEs(y),'ca')||x.nom.localeCompare(y.nom,'ca'));
  const fets=objs.filter(o=>(o.comprovat===avui()&&!o.falta)||o.falta).length;
  const pc = objs.length?Math.round(fets/objs.length*100):0;
  obrir('<h2>Revisió de '+esc(a.nom)+'</h2>'+
    '<p class="on">'+fets+' de '+objs.length+' revisats avui</p>'+
    '<div class="barra-prog"><i style="width:'+pc+'%"></i></div>'+
    objs.map(o=>{
      const ok=o.comprovat===avui()&&!o.falta;
      return '<div class="rev"><div class="t"><div class="nom">'+esc(o.nom)+
        (o.quantitat!=null?' <span class="qt">×'+o.quantitat+'</span>':'')+'</div>'+
        '<div class="on">'+esc(onEsDes(o,revArrel))+
        (o.prestec&&o.prestec.qui?' · fora, amb '+esc(o.prestec.qui):'')+
        (!ok&&o.comprovat?' · vist '+esc(quanTxt(o.comprovat)):'')+'</div></div>'+
        '<div class="b-grup">'+
        '<button class="b xicot clar'+(ok?' si':'')+'" onclick="marcarRev(\''+o.id+'\',true)">Hi és</button>'+
        '<button class="b xicot clar'+(o.falta?' no':'')+'" onclick="marcarRev(\''+o.id+'\',false)">Falta</button>'+
        '</div></div>';
    }).join('')+
    '<div class="fila-b dreta" style="margin-top:18px">'+
    '<button class="b" onclick="acabarRevisio()">Acaba la revisió</button></div>','ample');
}
function marcarRev(id,hiEs){
  const o=PER_ID[id]; if(!o) return;
  if(hiEs){ o.comprovat=avui(); o.falta=false; } else o.falta=true;
  o.actualitzat=new Date().toISOString();
  pintarRevisio();
}
function acabarRevisio(){
  const objs=totsSota(revArrel);
  const falten=objs.filter(o=>o.falta);
  const vistos=objs.filter(o=>o.comprovat===avui()&&!o.falta).length;
  obrir('<h2>Revisió acabada</h2><p class="on">'+vistos+' comprovats'+
    (falten.length?', '+falten.length+' sense trobar':'')+'.</p>'+
    (falten.length?falten.map(o=>fila(o,true)).join('')
      :'<div class="res-buit"><b>Tot al seu lloc</b>No falta res.</div>')+
    '<div class="fila-b dreta" style="margin-top:18px"><button class="b clar" onclick="tanca()">Tanca</button></div>',
    'ample');
  desar(); pintar();
}

/* ===================== pendents ===================== */
/* A ordinador viu en una columna fixa a la dreta i no cal obrir res; a mòbil
   segueix sent un panell de la barra de baix. El contingut és el mateix.     */

const lateralActiu = () => window.matchMedia('(min-width:1040px)').matches;

function cosPendents(compacte){
  const tsq=totesLesTasques(), fora=prestats(), antics=perComprovar();
  let cos='';
  if(pestanya==='tasques'){
    cos = tsq.length ? tsq.map(x=>
      '<div class="rev"><div class="t"><div class="nom">'+esc(x.t.text)+'</div>'+
      '<div class="on">'+esc(x.o.nom)+(compacte?'':' · '+esc(onEs(x.o)))+
      (x.t.quan?' · <b style="color:'+(vençuda(x.t)?'var(--alerta)':'var(--tinta)')+'">'+
        esc(quanTxt(x.t.quan))+'</b>':'')+
      (x.t.mesos?' · cada '+x.t.mesos+' mesos':'')+'</div></div>'+
      (EDITA()?'<div class="b-grup"><button class="b xicot clar" onclick="ferTasca(\''+x.o.id+'\',\''+
        x.t.id+'\')">Fet</button></div>':'')+'</div>').join('')
      : '<div class="res-buit"><b>Cap tasca apuntada</b>S\'afegeixen des del formulari de cada objecte.</div>';
  } else if(pestanya==='fora'){
    cos = fora.length ? fora.map(o=>
      '<div class="rev"><div class="t"><div class="nom">'+esc(o.nom)+'</div>'+
      '<div class="on">amb '+esc(o.prestec.qui)+' des de '+esc(quanTxt(o.prestec.des))+
      (o.prestec.torna?' · havia de tornar '+esc(quanTxt(o.prestec.torna)):'')+'</div></div>'+
      (EDITA()?'<div class="b-grup"><button class="b xicot clar" onclick="formPrestec(\''+
        o.id+'\')">Ha tornat</button></div>':'')+'</div>').join('')
      : '<div class="res-buit"><b>No hi ha res fora del cau</b>Tot és al seu lloc.</div>';
  } else {
    cos = antics.length ? antics.map(o=>
      '<div class="rev"><div class="t"><div class="nom">'+esc(o.nom)+
      (o.falta?' <span class="e falta">no s\'ha trobat</span>':'')+'</div>'+
      '<div class="on">'+(compacte?'':esc(onEs(o))+' · ')+
      (o.comprovat?'comprovat '+esc(quanTxt(o.comprovat)):'mai comprovat')+'</div></div>'+
      '<div class="b-grup"><button class="b xicot clar" onclick="anarAObjecte(\''+o.id+
      '\')">Ves-hi</button></div></div>').join('')
      : '<div class="res-buit"><b>Tot comprovat</b>No hi ha res pendent de l\'últim any.</div>';
  }
  const pb=(k,t,n)=>'<button class="'+(pestanya===k?'tria':'')+'" onclick="pendents(\''+k+'\')">'+
    t+(n?' · '+n:'')+'</button>';
  return '<div class="pest">'+pb('tasques','Coses a fer',tsq.length)+pb('fora','Fora del cau',fora.length)+
    pb('antics','Per comprovar',antics.length)+'</div>'+cos;
}

function pendents(p){
  if(p) pestanya=p;
  if(lateralActiu()){ pintarLateral(); return; }
  obrir('<h2>Pendents</h2>'+cosPendents(false)+
    '<div class="fila-b dreta" style="margin-top:18px"><button class="b clar" onclick="tanca()">Tanca</button></div>',
    'ample');
}

function pintarLateral(){
  const c=$('#lateral'); if(!c) return;
  if(!lateralActiu()){ c.innerHTML=''; return; }
  const n=quePendents();
  const y=c.querySelector('.cos-lat') ? c.querySelector('.cos-lat').scrollTop : 0;
  c.innerHTML='<div class="caixa-lat"><div class="cap-lat"><h2>Pendents</h2>'+
    (n?'<span class="bola">'+n+'</span>':'')+'</div>'+
    '<div class="cos-lat">'+cosPendents(true)+'</div></div>';
  const nou=c.querySelector('.cos-lat'); if(nou) nou.scrollTop=y;
}

/* ===================== llistes ===================== */
/* Una llista és un grapat d'objectes triats de l'inventari: el que us endueu a
   un campament, el que cal revisar, el que es presta a un altre agrupament.
   Es guarda, es reobre, es torna a fer servir i es pot marcar tota de cop com
   a treta del cau.                                                            */

let llistaOberta=null, ordreLl='lloc', tagsLl=[], cercaLl='', TAGS_LL=[];

function grupDe(o,ordre){
  if(ordre==='nom') return (o.nom.trim()[0]||'?').toUpperCase();
  if(ordre==='etiqueta') return etsDe(o)[0]||'Sense etiqueta';
  const t=[]; let x=o.pare?PER_ID[o.pare]:null, g=0;
  while(x&&g++<20){ t.unshift(x.nom); x=x.pare?PER_ID[x.pare]:null; }
  return t.join(' › ')||'Sense ubicació';
}

function agrupa(objs,ordre){
  const m=new Map();
  objs.forEach(o=>{
    const k=grupDe(o,ordre);
    if(!m.has(k)) m.set(k,[]);
    m.get(k).push(o);
  });
  return [...m.entries()]
    .sort((a,b)=>a[0].localeCompare(b[0],'ca'))
    .map(([k,v])=>[k, v.sort((a,b)=>a.nom.localeCompare(b.nom,'ca'))]);
}

const llistaPerId = id => LLISTES.find(l=>l.id===id);
const itemsDe = l => (l&&Array.isArray(l.items)?l.items:[]).filter(i=>PER_ID[i.id]);
const objsDeLlista = l => itemsDe(l).map(i=>PER_ID[i.id]);

/* ---------- índex de llistes ---------- */
function llistes(){
  llistaOberta=null;
  const files = LLISTES.slice().sort((a,b)=>
    String(b.actualitzada||b.creada||'').localeCompare(String(a.actualitzada||a.creada||'')));
  const cos = files.length ? files.map(l=>{
    const n=itemsDe(l).length;
    const fora=l.extreta&&(l.extreta.qui||l.extreta.quan);
    const tard=fora&&l.extreta.torna&&diesFins(l.extreta.torna)<0;
    return '<div class="fitxa-ll"><div class="t"><div class="nm">'+esc(l.nom||'Llista sense nom')+
      (fora?'<span class="fora-marca'+(tard?' tard':'')+'">fora del cau</span>':'')+'</div>'+
      '<div class="sub">'+compteTxt(n)+
      (fora?' · se\'ls va endur '+esc(l.extreta.qui||'algú')+' '+esc(quanTxt(l.extreta.quan))+
        (l.extreta.torna?', torna '+esc(quanTxt(l.extreta.torna)):''):'')+
      (!fora&&l.actualitzada?' · '+esc(quanTxt(l.actualitzada)):'')+'</div></div>'+
      '<div class="b-grup"><button class="b xicot clar" onclick="obrirLlista(\''+l.id+'\')">Obre</button>'+
      '<button class="b xicot clar" onclick="excelLlista(\''+l.id+'\')">Excel</button>'+
      (EDITA()?'<button class="b xicot clar" onclick="menuLlista(\''+l.id+'\')">⋯</button>':'')+
      '</div></div>';
  }).join('') : '<div class="res-buit"><b>Encara no hi ha cap llista</b>'+
      'Una llista és el que us endueu a un campament, o el que cal revisar. Se selecciona un cop '+
      'i es torna a fer servir cada any.</div>';

  obrir('<h2>Llistes</h2><p class="on">Queden guardades. Es poden reobrir, editar i reutilitzar.</p>'+
    cos+
    '<div class="fila-b" style="margin-top:18px">'+
    (EDITA()?'<button class="b" onclick="novaLlista()">Nova llista</button>':'')+
    '<button class="b clar" onclick="tanca()">Tanca</button></div>','ample');
}

function novaLlista(){
  obrir('<h2>Nova llista</h2><p class="on">Posa-li un nom que es reconegui d\'aquí a un any.</p>'+
    '<div class="camp"><label for="nl">Nom</label>'+
    '<input id="nl" placeholder="Campaments d\'estiu"></div>'+
    '<div class="fila-b dreta"><button class="b clar" onclick="llistes()">Enrere</button>'+
    '<button class="b" id="nlok">Crea-la</button></div>');
  $('#nl').focus();
  const fer=()=>{
    const nom=$('#nl').value.trim(); if(!nom){ $('#nl').focus(); return; }
    const l={id:nouId('ll'),nom:nom,notes:'',creada:avui(),actualitzada:avui(),items:[],extreta:null};
    LLISTES.push(l); desar(); obrirLlista(l.id);
  };
  $('#nlok').onclick=fer;
  $('#nl').onkeydown=e=>{ if(e.key==='Enter') fer(); };
}

function menuLlista(id){
  const l=llistaPerId(id); if(!l) return;
  obrir('<h2>'+esc(l.nom)+'</h2><p class="on">'+compteTxt(itemsDe(l).length)+'</p>'+
    '<button class="opcio" onclick="tanca();obrirLlista(\''+id+'\')">'+ic('llapis')+
      '<span>Obre i edita</span></button>'+
    '<button class="opcio" onclick="tanca();reanomenarLlista(\''+id+'\')">'+ic('llapis')+
      '<span>Canvia-li el nom</span></button>'+
    '<button class="opcio" onclick="tanca();duplicarLlista(\''+id+'\')">'+ic('caixa')+
      '<span>Duplica-la<small>Per fer-ne una variant sense tocar aquesta</small></span></button>'+
    '<button class="opcio" onclick="tanca();excelLlista(\''+id+'\')">'+ic('excel')+
      '<span>Descarrega-la en Excel</span></button>'+
    '<button class="opcio" onclick="tanca();buidarLlistaPerId(\''+id+'\')">'+ic('paperera')+
      '<span>Treu-ne tots els objectes<small>La llista es queda, però buida</small></span></button>'+
    '<button class="opcio perill" onclick="tanca();esborrarLlista(\''+id+'\')">'+ic('paperera')+
      '<span>Esborra-la per sempre</span></button>','baix');
}

function reanomenarLlista(id){
  const l=llistaPerId(id); if(!l) return;
  obrir('<h2>Nom de la llista</h2>'+
    '<div class="camp"><label for="rl">Com se\'n diu</label>'+
    '<input id="rl" value="'+esc(l.nom)+'"></div>'+
    '<div class="fila-b dreta"><button class="b clar" onclick="llistes()">Enrere</button>'+
    '<button class="b" id="rlok">Desa</button></div>');
  $('#rl').focus(); $('#rl').select();
  $('#rlok').onclick=()=>{
    const nom=$('#rl').value.trim(); if(!nom) return;
    l.nom=nom; l.actualitzada=avui(); desar(); llistes();
  };
}

function duplicarLlista(id){
  const l=llistaPerId(id); if(!l) return;
  const nova={id:nouId('ll'),nom:l.nom+' (còpia)',notes:l.notes||'',creada:avui(),
    actualitzada:avui(),items:itemsDe(l).map(i=>({id:i.id,quantitat:i.quantitat})),extreta:null};
  LLISTES.push(nova); desar(); obrirLlista(nova.id);
}

function esborrarLlista(id){
  const l=llistaPerId(id); if(!l) return;
  const fora=l.extreta&&(l.extreta.qui||l.extreta.quan);
  obrir('<h2>Esborrar «'+esc(l.nom)+'»?</h2><p class="on">'+
    'La llista desapareix per sempre. Els objectes no es toquen: continuen a l\'inventari.'+
    (fora?' Com que està marcada com a treta del cau, els objectes es quedaran marcats com a '+
      'fora; caldrà tornar-los un per un.':'')+'</p>'+
    '<div class="fila-b dreta"><button class="b clar" onclick="llistes()">Cancel·la</button>'+
    '<button class="b perill" id="elok">Esborra-la</button></div>');
  $('#elok').onclick=()=>{
    LLISTES=LLISTES.filter(x=>x.id!==id);
    desar(); llistes();
  };
}

/* ---------- constructor de dues bandes ---------- */
function obrirLlista(id){
  llistaOberta=id; cercaLl=''; tagsLl=[];
  const l=llistaPerId(id); if(!l) return llistes();
  TAGS_LL=totesLesEtiquetes();
  obrir('<div class="ll-cap">'+
      '<button class="tornar nomes-icona" onclick="llistes()" aria-label="Torna a les llistes">'+
        ic('enrere')+'</button>'+
      (EDITA()?'<input class="nom" id="ll-nom" value="'+esc(l.nom)+'" aria-label="Nom de la llista">'
             :'<h2 style="flex:1">'+esc(l.nom)+'</h2>')+
    '</div>'+
    '<div id="ll-estat"></div>'+
    '<div class="ll-eines">'+
      '<input class="cerca-mini" id="ll-q" type="search" placeholder="Filtra per nom" '+
        'autocomplete="off" aria-label="Filtra els objectes">'+
      '<select id="ll-ordre" aria-label="Com s\'ordena">'+
        '<option value="lloc">Per sala i moble</option>'+
        '<option value="nom">Per nom</option>'+
        '<option value="etiqueta">Per etiqueta</option>'+
      '</select></div>'+
    (TAGS_LL.length?'<div class="ll-tags" id="ll-tags">'+TAGS_LL.map((t,i)=>
      '<button onclick="capgiraTag('+i+')">'+esc(t)+'</button>').join('')+
      '</div>':'')+
    '<div class="panells">'+
      '<div class="panell"><h3><span>Al cau</span>'+
        (EDITA()?'<button class="mini-acc" onclick="afegirTotElQueEsVeu()">Afegeix-ho tot</button>':'')+
        '<span class="n" id="n-cau"></span></h3>'+
        '<div class="cos-p" id="pane-cau"></div></div>'+
      '<div class="panell"><h3><span>A la llista</span><span class="n" id="n-llista"></span></h3>'+
        '<div class="cos-p" id="pane-llista"></div></div>'+
    '</div>'+
    '<div class="fila-b" style="margin-top:16px" id="ll-peu"></div>','enorme');

  if(EDITA()) $('#ll-nom').onchange=()=>{
    const nom=$('#ll-nom').value.trim();
    if(nom){ l.nom=nom; l.actualitzada=avui(); desar(); }
  };
  $('#ll-q').addEventListener('input', e=>{ cercaLl=e.target.value.trim(); panells(); });
  $('#ll-ordre').value=ordreLl;
  $('#ll-ordre').onchange=e=>{ ordreLl=e.target.value; panells(); };
  panells();
}

/* Per índex, no pel text: una etiqueta amb apòstrof trencaria l'atribut. */
function capgiraTag(i){
  const t=TAGS_LL[i]; if(t===undefined) return;
  tagsLl = tagsLl.includes(t) ? tagsLl.filter(x=>x!==t) : tagsLl.concat([t]);
  const c=$('#ll-tags');
  if(c) [].slice.call(c.querySelectorAll('button')).forEach((b,j)=>
    b.classList.toggle('tria', tagsLl.includes(TAGS_LL[j])));
  panells();
}

function passaFiltre(o){
  if(cercaLl.length && !norm(o.nom).includes(norm(cercaLl)) &&
     !etsDe(o).some(e=>norm(e).includes(norm(cercaLl)))) return false;
  if(tagsLl.length && !etsDe(o).some(e=>tagsLl.includes(e))) return false;
  return true;
}

function panells(){
  const l=llistaPerId(llistaOberta); if(!l) return;
  const dins=new Set(itemsDe(l).map(i=>i.id));
  const tots=DADES.filter(f=>f.tipus==='objecte');
  const fora=tots.filter(o=>!dins.has(o.id)&&passaFiltre(o));
  const sel=objsDeLlista(l).filter(passaFiltre);

  const pc=$('#pane-cau'), pl=$('#pane-llista');
  const sc1=pc?pc.scrollTop:0, sc2=pl?pl.scrollTop:0;

  pc.innerHTML = fora.length
    ? agrupa(fora,ordreLl).map(([g,items])=>'<div class="grup">'+esc(g)+'</div>'+
        items.map(o=>linia(o,'+','afegirALlista')).join('')).join('')
    : '<div class="p-buit">'+(tots.length?'Res que encaixi amb el filtre.':'L\'inventari és buit.')+'</div>';

  pl.innerHTML = sel.length
    ? agrupa(sel,ordreLl).map(([g,items])=>'<div class="grup">'+esc(g)+'</div>'+
        items.map(o=>linia(o,'−','treureDeLlista',l)).join('')).join('')
    : '<div class="p-buit">Encara no hi ha res. Toca un objecte de l\'altre costat.</div>';

  if(pc) pc.scrollTop=sc1;
  if(pl) pl.scrollTop=sc2;
  $('#n-cau').textContent=fora.length;
  $('#n-llista').textContent=itemsDe(l).length;
  peuLlista(l);
  estatLlista(l);
}

function linia(o,signe,accio,l){
  const it = l ? itemsDe(l).find(i=>i.id===o.id) : null;
  const sub = [grupDe(o,ordreLl==='lloc'?'etiqueta':'lloc')]
    .concat(etsDe(o).length&&ordreLl!=='etiqueta'?[etsDe(o).join(', ')]:[])
    .filter(x=>x&&x!=='Sense etiqueta'&&x!=='Sense ubicació');
  return '<div class="lin" onclick="'+accio+'(\''+o.id+'\')">'+
    '<span class="sig">'+signe+'</span>'+
    '<div class="t"><div class="nm">'+esc(o.nom)+'</div>'+
    (sub.length?'<div class="sub">'+esc(sub[0])+'</div>':'')+'</div>'+
    (it && EDITA()
      ? '<input class="qtx" type="number" min="0" value="'+(it.quantitat==null?'':it.quantitat)+
        '" onclick="event.stopPropagation()" onchange="quantitatItem(\''+o.id+'\',this.value)" '+
        'aria-label="Quants en portes">'
      : (o.quantitat!=null?'<span class="qt">×'+o.quantitat+'</span>':''))+
    '</div>';
}

function afegirALlista(idObj){
  if(!EDITA()) return;
  const l=llistaPerId(llistaOberta), o=PER_ID[idObj];
  if(!l||!o) return;
  if(itemsDe(l).some(i=>i.id===idObj)) return;
  l.items=itemsDe(l).concat([{id:idObj,quantitat:o.quantitat}]);
  l.actualitzada=avui();
  panells(); desar();
}
function treureDeLlista(idObj){
  if(!EDITA()) return;
  const l=llistaPerId(llistaOberta); if(!l) return;
  l.items=itemsDe(l).filter(i=>i.id!==idObj);
  l.actualitzada=avui();
  panells(); desar();
}
function quantitatItem(idObj,val){
  const l=llistaPerId(llistaOberta); if(!l) return;
  const it=itemsDe(l).find(i=>i.id===idObj); if(!it) return;
  it.quantitat = val===''?null:Math.max(0,Number(val)||0);
  l.actualitzada=avui();
  desar();
}
function afegirTotElQueEsVeu(){
  const l=llistaPerId(llistaOberta); if(!l||!EDITA()) return;
  const dins=new Set(itemsDe(l).map(i=>i.id));
  const nous=DADES.filter(f=>f.tipus==='objecte'&&!dins.has(f.id)&&passaFiltre(f))
    .map(o=>({id:o.id,quantitat:o.quantitat}));
  if(!nous.length) return;
  l.items=itemsDe(l).concat(nous); l.actualitzada=avui();
  panells(); desar();
}
function buidarLlistaPerId(id){
  const l=llistaPerId(id); if(!l||!EDITA()) return;
  l.items=[]; l.actualitzada=avui(); desar(); llistes();
}

function estatLlista(l){
  const c=$('#ll-estat'); if(!c) return;
  const e=l.extreta;
  if(!e||(!e.qui&&!e.quan)){ c.innerHTML=''; return; }
  const tard=e.torna&&diesFins(e.torna)<0;
  c.innerHTML='<div class="avis-barra" style="'+(tard?'':
    'background:var(--raiers-suau);color:var(--raiers)')+'"><span class="creix">'+
    'Fora del cau des de '+esc(quanTxt(e.quan))+', amb '+esc(e.qui||'algú')+
    (e.torna?'. Havia de tornar '+esc(quanTxt(e.torna)):'')+
    (e.notes?'. '+esc(e.notes):'')+'</span></div>';
}

function peuLlista(l){
  const c=$('#ll-peu'); if(!c) return;
  const fora=l.extreta&&(l.extreta.qui||l.extreta.quan);
  let h='';
  if(EDITA()){
    h += fora
      ? '<button class="b" onclick="tornarLlista()">Ha tornat tot</button>'
      : '<button class="b" onclick="formExtreure()">Marca-ho com a tret del cau</button>';
  }
  h += '<button class="b clar" onclick="excelLlista(\''+l.id+'\')">Excel</button>';
  h += '<button class="b clar" onclick="llistes()">Fet</button>';
  c.innerHTML=h;
}

/* ---------- treure i tornar tota la llista ---------- */
function formExtreure(){
  const l=llistaPerId(llistaOberta); if(!l) return;
  const n=itemsDe(l).length;
  if(!n){ alert('La llista és buida.'); return; }
  obrir('<h2>Treure «'+esc(l.nom)+'» del cau</h2>'+
    '<p class="on">Els '+n+' objectes de la llista quedaran marcats com a fora, un per un, '+
    'amb aquestes dades.</p>'+
    '<div class="camp"><label for="e1">Qui se\'ls endú</label>'+
      '<input id="e1" placeholder="Nom de qui se\'n fa responsable" value="'+
      esc(l.extreta&&l.extreta.qui||'')+'"></div>'+
    '<div class="duo"><div class="camp"><label for="e2">Quan surten</label>'+
      '<input id="e2" type="date" value="'+avui()+'"></div>'+
      '<div class="camp"><label for="e3">Quan tornen</label>'+
      '<input id="e3" type="date"></div></div>'+
    '<div class="camp"><label for="e4">Notes</label>'+
      '<textarea id="e4" placeholder="A on van, dins de quina furgoneta, què cal vigilar…"></textarea></div>'+
    '<div class="fila-b dreta"><button class="b clar" onclick="obrirLlista(\''+l.id+'\')">Cancel·la</button>'+
    '<button class="b" id="exok">Marca-ho</button></div>');
  $('#e1').focus();
  $('#exok').onclick=()=>{
    const qui=$('#e1').value.trim(); if(!qui){ $('#e1').focus(); return; }
    const quan=$('#e2').value||avui(), torna=$('#e3').value||'', notes=$('#e4').value.trim();
    l.extreta={qui:qui,quan:quan,torna:torna,notes:notes};
    l.actualitzada=avui();
    objsDeLlista(l).forEach(o=>{
      o.prestec={qui:qui,des:quan,torna:torna};
      o.actualitzat=new Date().toISOString();
    });
    indexar(); desar(); obrirLlista(l.id);
  };
}

function tornarLlista(){
  const l=llistaPerId(llistaOberta); if(!l) return;
  const n=itemsDe(l).length;
  obrir('<h2>Ha tornat tot?</h2>'+
    '<p class="on">Els '+n+' objectes de «'+esc(l.nom)+'» es marcaran com a tornats i '+
    'comprovats avui. Si en falta algun, torna\'ls igualment i després marca\'l com a perdut '+
    'des de la seva fitxa.</p>'+
    '<div class="fila-b dreta"><button class="b clar" onclick="obrirLlista(\''+l.id+'\')">Encara no</button>'+
    '<button class="b" id="tlok">Sí, ja és tot aquí</button></div>');

    });

    indexar(); desar(); obrirLlista(l.id);
  };
}
