/* ===================== Excel ===================== */
/* SheetJS no pot crear taules dinàmiques de debò des del navegador, o sigui que
   el que es genera és una taula amb filtre a totes les columnes: es reordena i
   es filtra igual, i des d'allà l'Excel fa la dinàmica amb dos clics
   (Insereix > Taula dinàmica, amb el rang ja seleccionat).                    */

const CAPS = ['Objecte','Quantitat al cau','Quants en portes','Etiquetes','Sala','Moble','Casella',
  'On és (camí sencer)','Notes','Estat','Comprovat','Coses a fer'];

function mobleDe(o){
  let x=o.pare?PER_ID[o.pare]:null, g=0, ultim=null;
  while(x&&g++<20){ if(x.tipus==='moble') ultim=x; x=x.pare?PER_ID[x.pare]:null; }
  const cadena=[]; let y=o.pare?PER_ID[o.pare]:null, h=0;
  while(y&&y.tipus==='moble'&&h++<20){ cadena.unshift(y.nom); y=y.pare?PER_ID[y.pare]:null; }
  return cadena.join(' › ')||(ultim?ultim.nom:'');
}

function filaExcel(o,quants){
  const sala=salaDe(o.id);
  return [
    o.nom,
    o.quantitat==null?'':o.quantitat,
    quants==null?'':quants,
    etsDe(o).join(', '),
    sala?sala.nom:'',
    mobleDe(o),
    o.pos?etqPos(o.pos):'',
    onEs(o),
    o.notes||'',
    o.falta ? 'no s\'ha trobat'
      : (o.prestec&&o.prestec.qui) ? 'fora, amb '+o.prestec.qui : 'al seu lloc',
    o.comprovat||'',
    tasquesDe(o).map(t=>t.text+(t.quan?' ('+t.quan+')':'')).join('; ')
  ];
}

/* Un full amb capçalera, filtres a totes les columnes i la primera fila fixada. */
function fullTaula(aoa,amples){
  const full=XLSX.utils.aoa_to_sheet(aoa);
  full['!cols']=amples.map(w=>({wch:w}));
  const ultima=XLSX.utils.encode_cell({r:Math.max(aoa.length-1,0), c:aoa[0].length-1});
  full['!autofilter']={ref:'A1:'+ultima};
  return full;
}

const AMPLES=[34,15,15,26,14,26,14,50,34,18,13,38];

/* Resum: el que una taula dinàmica ensenyaria de primeres. */
function fullResum(objs){
  const perSala=new Map(), perTag=new Map(), perMoble=new Map();
  objs.forEach(o=>{
    const s=salaDe(o.id), k=s?s.nom:'Sense sala';
    perSala.set(k,(perSala.get(k)||0)+1);
    const m=mobleDe(o)||'Sense moble';
    perMoble.set(m,(perMoble.get(m)||0)+1);
    const ets=etsDe(o);
    (ets.length?ets:['Sense etiqueta']).forEach(e=>perTag.set(e,(perTag.get(e)||0)+1));
  });
  const bloc=(titol,m)=>[[titol,'Objectes']].concat(
    [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ca')));
  const aoa=[].concat(
    [['Resum','']], [['','']],
    bloc('Per sala',perSala), [['','']],
    bloc('Per moble',perMoble), [['','']],
    bloc('Per etiqueta',perTag));
  const full=XLSX.utils.aoa_to_sheet(aoa);
  full['!cols']=[{wch:38},{wch:12}];
  return full;
}

function comprovaXLSX(){
  if(typeof XLSX==='undefined'){
    alert('La part que genera l\'Excel encara s\'està carregant. Prova-ho d\'aquí un segon.');
    return false;
  }
  return true;
}

function baixarExcel(){
  if(!comprovaXLSX()) return;
  const objs=DADES.filter(f=>f.tipus==='objecte').sort((a,b)=>a.nom.localeCompare(b.nom,'ca'));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, fullTaula([CAPS].concat(objs.map(o=>filaExcel(o,null))),AMPLES),'Inventari');
  XLSX.utils.book_append_sheet(wb, fullResum(objs),'Resum');
  XLSX.writeFile(wb,'inventari-cau-'+avui()+'.xlsx');
}

function excelLlista(id){
  if(!comprovaXLSX()) return;
  const l=llistaPerId(id); if(!l) return;
  const items=itemsDe(l);
  const objs=items.map(i=>PER_ID[i.id])
    .sort((a,b)=>grupDe(a,'lloc').localeCompare(grupDe(b,'lloc'),'ca')||a.nom.localeCompare(b.nom,'ca'));
  const quants=new Map(items.map(i=>[i.id,i.quantitat]));

  const capsal=[['Llista', l.nom||'sense nom'],
    ['Generat el', avui()],
    ['Objectes', objs.length]];
  if(l.extreta&&(l.extreta.qui||l.extreta.quan)){
    capsal.push(['Fora del cau amb', l.extreta.qui||'']);
    capsal.push(['Des de', l.extreta.quan||'']);
    if(l.extreta.torna) capsal.push(['Torna el', l.extreta.torna]);
    if(l.extreta.notes) capsal.push(['Notes', l.extreta.notes]);
  }

  const aoa=capsal.concat([['','']], [CAPS], objs.map(o=>filaExcel(o, quants.get(o.id))));
  const full=XLSX.utils.aoa_to_sheet(aoa);
  full['!cols']=AMPLES.map(w=>({wch:w}));
  const filaCaps=capsal.length+1;               // 0-indexat: on és la fila de capçaleres
  full['!autofilter']={ref:XLSX.utils.encode_cell({r:filaCaps,c:0})+':'+
    XLSX.utils.encode_cell({r:aoa.length-1,c:CAPS.length-1})};

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, full, 'Llista');
  XLSX.utils.book_append_sheet(wb, fullResum(objs), 'Resum');
  XLSX.utils.book_append_sheet(wb,
    fullTaula([CAPS].concat(DADES.filter(f=>f.tipus==='objecte')
      .sort((a,b)=>a.nom.localeCompare(b.nom,'ca')).map(o=>filaExcel(o,null))), AMPLES),
    'Inventari sencer');

  const net=(l.nom||'llista').replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,40)||'llista';
  XLSX.writeFile(wb, net+' — '+avui()+'.xlsx');
}

    <h3>Llistes</h3>
    <p>Una llista és un grapat d'objectes triats: el que us endueu a un campament, el que presteu a
    un altre agrupament, el que cal revisar. Es fa un cop i es reutilitza cada any.</p>
    <p>A <b>Llistes</b> &rsaquo; <b>Nova llista</b> li poses nom i s'obre el constructor, amb dues

      igual, o sigui que si ho poses per sala recorres el cau en ordre i no et deixes res.</li>

    marca <i>tots</i> els objectes de la llista com a fora d'una tacada. A partir d'aquí surten
    marcats per tota l'aplicació i apareixen a <b>Pendents &rsaquo; Fora del cau</b>. Quan torna
    tot, <b>Ha tornat tot</b> els allibera de cop i els marca com a comprovats avui.</p>
    <p>Als tres punts de cada llista hi ha <b>duplicar-la</b> (per fer-ne una variant sense tocar
    l'original), <b>canviar-li el nom</b> i <b>esborrar-la per sempre</b>. Esborrar una llista no
    toca els objectes: continuen a l'inventari.</p>

    <h3>Pendents</h3>
    <p>El botó de baix amb el número vermell. Té tres pestanyes:</p>
    <ul>
      <li><b>Coses a fer</b> &mdash; les tasques de cada objecte, per data. Una tasca amb mesos es
      repeteix: la farmaciola amb &laquo;renovar les vendes, cada 8 mesos&raquo; torna a aparèixer
      sola quan la marques com a feta. Sense mesos, desapareix.</li>
      <li><b>Fora del cau</b> &mdash; tot el que algú s'ha endut, individualment o amb una llista.</li>
      <li><b>Per comprovar</b> &mdash; el que fa més d'un any que ningú mira, o el que no s'ha
      trobat. És el termòmetre de si l'inventari encara diu la veritat.</li>
    </ul>

    <h3>Revisar</h3>
    <p>El botó <b>Revisa</b> surt a qualsevol sala o moble. Et llista el que hi hauria d'haver amb
    dos botons per cosa: <b>Hi és</b> o <b>Falta</b>. Vas marcant mentre ho mires de debò i al final
    et dona el resum del que no has trobat.</p>
    <p>Fes-ho moble per moble, no sala sencera. Vint coses es revisen bé; dues-centes es deixen a
    mitges.</p>

    <h3>Excel</h3>
    <p>Des de <b>Més</b> baixa tot l'inventari; des d'una llista, el botó <b>Excel</b> baixa la
    llista. El fitxer porta tres fulls: la taula, un <b>Resum</b> amb els recomptes per sala, per
    moble i per etiqueta, i l'inventari sencer.</p>
    <p>Totes les columnes porten <b>filtre</b>, o sigui que es reordena i es filtra des de la
    fletxa de cada capçalera. No és una taula dinàmica de debò &mdash; això no es pot generar des
    del navegador &mdash; però si en vols una, selecciona qualsevol cel·la de la taula i fes
    <i>Insereix &rsaquo; Taula dinàmica</i>: l'Excel ja n'agafa el rang sol.</p>
    <p>Per la mateixa raó la capçalera no queda fixada: si la taula és llarga, fes
    <i>Visualitza &rsaquo; Immobilitza &rsaquo; Immobilitza la fila superior</i> un cop i ja la
    tindràs sempre a la vista.</p>

    <h3>Si alguna cosa falla</h3>
    <ul>
      <li><b>&laquo;Algú altre ha desat canvis&raquo;</b> &mdash; dues persones editàveu alhora.
      Recarrega; el que hagis fet en aquesta estona no s'ha guardat.</li>
      <li><b>No es desa</b> &mdash; comprova la connexió i torna-ho a provar amb el botó que surt.</li>

      algú desa es guarda com estava abans.</li>

    <p class="m-final">Els canvis es desen sols; no hi ha cap botó de guardar. A dalt a la dreta

function rect(g,o){
  o=o||{};
  const r=o.r!=null?o.r:(g.r!=null?g.r:0);
  let e='<rect x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" rx="'+r+'"';
  if(o.cls) e+=' class="'+o.cls+'"';
  if(o.fill) e+=' fill="'+o.fill+'"';
  if(o.stroke) e+=' stroke="'+o.stroke+'"';
  if(o.opac!=null) e+=' opacity="'+o.opac+'"';
  if(o.estil) e+=' style="'+o.estil+'"';
  return e+'></rect>';
}
function tecla(ev,id){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); entrar(id); } }

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && capa){ tanca(); return; }
  if($('#dlg').open) return;
  if(e.key==='Escape'){ enrere(); return; }
  if((e.key==='Backspace'||e.key==='ArrowLeft') &&
     !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); enrere();
  }
  if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); const q=$('#q'); if(q) q.focus();
  }
});

let tempsMida;
addEventListener('resize', ()=>{
  clearTimeout(tempsMida);
  tempsMida=setTimeout(()=>{ if(PER_ID && cami.length) pintar(); },180);
});

arrencar();
